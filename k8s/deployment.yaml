apiVersion: apps/v1
kind: Deployment
metadata:
  name: new-deploy-rd1
  labels:
    app: nginx
spec:
  replicas: 5
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: vijaygiduthuri/gitops-demo:v1
          ports:
            - containerPort: 80
